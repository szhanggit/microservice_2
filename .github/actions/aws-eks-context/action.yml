name: 'AWS + EKS context'
description: >-
  Assumes the GitHub OIDC IAM role (microservice_2_terraform/github-actions-oidc) and points
  kubectl at one environment's EKS cluster (via helm/scripts/update-kubeconfig.sh). Shared by
  deploy/rollback/destroy workflows instead of duplicating these steps in each.
inputs:
  role-to-assume:
    description: 'ARN of the IAM role to assume via OIDC'
    required: true
  environment:
    description: 'develop | staging | production'
    required: true
  aws-region:
    description: 'AWS region'
    required: false
    default: 'ca-central-1'
runs:
  using: composite
  steps:
    - uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ inputs.role-to-assume }}
        aws-region: ${{ inputs.aws-region }}

    - shell: bash
      run: bash helm/scripts/update-kubeconfig.sh ${{ inputs.environment }}
